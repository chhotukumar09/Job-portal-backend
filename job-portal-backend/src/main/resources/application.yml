server:
  port: ${PORT:8080}

spring:
  application:
    name: job-portal-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobportal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # Base64 encoded secret (min 256 bit). Production me ENV variable se do.
    secret: ${JWT_SECRET:Sm9iUG9ydGFsU3VwZXJTZWNyZXRLZXlGb3JKV1RTaWduaW5nX0NoYW5nZVRoaXNJblByb2R1Y3Rpb25fMjAyNg==}
    expiration-ms: 86400000   # 24 hours
  admin:
    email: ${ADMIN_EMAIL:admin@jobportal.com}
    password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
