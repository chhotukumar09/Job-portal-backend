services:
  postgres:
    image: postgres:16
    container_name: jobportal-db
    environment:
      POSTGRES_DB: jobportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobportal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: jobportal-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobportal
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-Sm9iUG9ydGFsU3VwZXJTZWNyZXRLZXlGb3JKV1RTaWduaW5nX0NoYW5nZVRoaXNJblByb2R1Y3Rpb25fMjAyNg==}
    ports:
      - "8080:8080"

volumes:
  pgdata:
